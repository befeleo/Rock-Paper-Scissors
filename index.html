<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <div class="play-ground">
        <div class="score-board box">
          <div class="reset-score">Reset Score</div>
          <div class="score-display">
            <div class="player">Player Score:</div>
            <div class="computer-score">Computer Score:</div>
          </div>
        </div>
        <div class="result-display box">
          <p class="result">Result for who won</p>
          <div class="images">
            <div class="img"></div>
            <p class="versus">VS</p>
            <div class="img"></div>
          </div>
          <p>Choose your move, rock paper or scissors?</p>
        </div>
        <div class="buttons box">
          <button type="button" class="btn">Rock</button>
          <button type="button" class="btn">Paper</button>
          <button type="button" class="btn">Scissors</button>
        </div>
      </div>
    </div>
  </body>
</html>
