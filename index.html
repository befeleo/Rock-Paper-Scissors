<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Rock Paper Scissors</h1>
      <div class="play-ground">
        <div class="score-board">
          <div class="reset-score">
            <button class="reset-btn">Reset</button>
          </div>
          <div class="score-display">
            <div class="player-score">
              Player Score: <span class="player">0</span>
            </div>
            <div class="computer-score">
              Computer Score: <span class="computer">0</span>
            </div>
          </div>
        </div>
        <div class="result-display">
          <div class="result">Make your move!</div>
          <div class="images">
            <div class="img">
              <img class="player-image" src="images/swords.svg" alt="swords" />
            </div>
            <p class="versus">VS</p>
            <div class="img">
              <img
                class="computer-image"
                src="images/swords.svg"
                alt="swords"
              />
            </div>
          </div>
          <p>Choose your move, rock paper or scissors?</p>
        </div>
        <div class="buttons">
          <button type="button" class="btn" id="rock" value="rock">Rock</button>
          <button type="button" class="btn" id="paper" value="paper">
            Paper
          </button>
          <button type="button" class="btn" id="scissors" value="scissors">
            Scissors
          </button>
        </div>
      </div>
    </div>

    <script src="script.js" defer></script>
  </body>
</html>
